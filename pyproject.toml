[build-system]
requires      = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ── Project metadata ──────────────────────────────────────────────────────────
[project]
name        = "ember-energy-forecasting"
version     = "1.0.0"
description = "Per-country electricity demand forecasting — Ember dataset | IEEE Paper"
readme      = "README.md"
license     = { file = "LICENSE" }
requires-python = ">=3.10"

authors = [
    { name = "Lotfi Ben Abdelaziz", email = "lotfibenabdelaziz@fst.utm.tn" },
]

keywords = [
    "forecasting", "electricity", "energy", "time-series",
    "machine-learning", "xgboost", "ieee","Langchain"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ── Core dependencies (pipeline) ─────────────────────────────────────────────
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.1.0",
    "xgboost>=1.7.0",
    "statsmodels>=0.13.0",
    "tensorflow>=2.10.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "dvc==3.67.1",
]

# ── Optional dependency groups ────────────────────────────────────────────────
[project.optional-dependencies]

# API server
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

# LangChain AI assistant
langchain = [
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "openai>=1.0.0",
    "tiktoken>=0.6.0",
]

# Notebooks
notebooks = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.0.0",
]

# Developer tools
dev = [
    "flake8>=6.0.0",
    "mypy>=1.8.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",     # test FastAPI
    "black>=24.0.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
    "pandas-stubs>=2.0.0",
    "types-requests>=2.31.0",
    "pytest-timeout>=2.2.0",    # needed by pytest.ini timeout=180
    "pytest-cov>=4.1.0",        # explicit coverage plugin
    #     "dvc>=3.0.0",               # pipeline caching & versioning
#     "dvc-s3>=3.0.0",            # optional: S3 remote support
#     # "dvc-gs>=3.0.0",          # optional: GCS remote
#     # "dvc-azure>=3.0.0",       # optional: Azure remote
    "python-jose[cryptography]>=3.3.0",
]

# Full install (everything)
all = [
    "ember-energy-forecasting[api,langchain,notebooks,dev]",
]

# ── CLI entry points ──────────────────────────────────────────────────────────
[project.scripts]
ember-pipeline = "pipeline:main"
ember-api      = "api.main:start"

# ── Setuptools package discovery ──────────────────────────────────────────────
[tool.setuptools.packages.find]
where   = ["."]
include = ["src*", "api*"]



[tool.ruff]
target-version = "py310"
line-length    = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "N803", "N806"]

[tool.ruff.format]
quote-style = "double"

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths       = ["tests"]
asyncio_mode    = "auto"
filterwarnings  = ["ignore::DeprecationWarning"]
log_cli         = true
log_cli_level   = "INFO"

# ── coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source  = ["src", "api"]
omit    = [
    "tests/*",
    "outputs/*",
    "notebooks/*",
    "src/*",
]

[tool.coverage.report]
show_missing = true
fail_under   = 60

