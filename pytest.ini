[pytest]
# ── Test discovery ────────────────────────────────────────────────────────────
testpaths       = tests
python_files    = test_*.py
python_classes  = Test*
python_functions= test_*

# ── Output ────────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -p no:warnings
    -p no:cacheprovider 
    --durations=10
    --ignore=tests/test_parity.py

# ── Markers ───────────────────────────────────────────────────────────────────
markers =
    unit:        Pure unit tests — no I/O or subprocesses
    integration: Tests that call CLI scripts or write files
    slow:        Tests that take > 10 seconds (modeling, deep learning)
    api:         FastAPI endpoint tests
    dl:          Deep learning tests (requires torch)
    parity:      Notebook vs script parity tests (requires pre-run outputs)

# ── Logging ───────────────────────────────────────────────────────────────────
log_cli             = true
log_cli_level       = INFO
log_cli_format      = %(asctime)s | %(levelname)s | %(message)s
log_cli_date_format = %H:%M:%S

# ── Timeouts (requires pytest-timeout) ───────────────────────────────────────
timeout = 180
