apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ember-data-pvc
  namespace: ember-pipeline
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ember-outputs-pvc
  namespace: ember-pipeline
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ember-mlruns-pvc
  namespace: ember-pipeline
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ember-cache-pvc
  namespace: ember-pipeline
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
