apiVersion: v1
kind: Pod
metadata:
  name: ember-output-exporter
  namespace: ember-pipeline
  labels:
    app: ember-energy-forecasting
    component: exporter
spec:
  restartPolicy: Never

  containers:
    - name: exporter
      image: busybox:1.35
      command:
        - sh
        - -c
        - |
          echo "Output files available at /outputs"
          echo "Copy them with:"
          echo "  kubectl cp ember-pipeline/ember-output-exporter:/outputs ./outputs"
          echo ""
          ls -lRh /outputs/
          # Keep pod alive for 30 min to allow kubectl cp
          sleep 1800
      volumeMounts:
        - name: outputs-volume
          mountPath: /outputs
          readOnly: true

  volumes:
    - name: outputs-volume
      persistentVolumeClaim:
        claimName: ember-outputs-pvc

# ── Usage ──────────────────────────────────────────────────────────────────────
# kubectl apply -f k8s/output-exporter.yaml
# kubectl cp ember-pipeline/ember-output-exporter:/outputs ./outputs
# kubectl delete pod ember-output-exporter -n ember-pipeline
