apiVersion: v1
kind: Pod
metadata:
  name: ember-output-exporter
  namespace: ember-pipeline
  labels:
    app: ember-energy-forecasting
    component: exporter
spec:
  restartPolicy: Never
  containers:
    - name: exporter
      image: busybox:1.35
      command:
        - sh
        - -c
        - |
          echo "Output files available at /outputs"
          echo "Copy with: kubectl cp ember-pipeline/ember-output-exporter:/outputs ./outputs"
          ls -lRh /outputs/
          sleep 1800
      volumeMounts:
        - name: outputs-volume
          mountPath: /outputs
          readOnly: true
      resources:
        limits:
          cpu: "100m"
          memory: "128Mi"
  volumes:
    - name: outputs-volume
      hostPath:
        path: /run/desktop/mnt/host/c/Users/bcs/Desktop/Energy World Project V2/outputs
        type: DirectoryOrCreate
