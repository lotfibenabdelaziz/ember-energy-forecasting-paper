apiVersion: apps/v1
kind: Deployment
metadata:
  name: ember-api
  namespace: ember-pipeline
  labels:
    app: ember-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ember-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ember-api
    spec:
      containers:
        - name: api
          image: ember-energy-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: ember-config
            - secretRef:
                name: ember-secrets

          resources:
            requests:
              cpu:    "100m"
              memory: "256Mi"
            limits:
              cpu:    "500m"
              memory: "512Mi"

          volumeMounts:
            - name: outputs
              mountPath: /app/outputs
              readOnly: true

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

      volumes:
        - name: outputs
          hostPath:
            path: /run/desktop/mnt/host/c/Users/bcs/Desktop/Energy World Project V2/outputs
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: ember-api-service
  namespace: ember-pipeline
spec:
  selector:
    app: ember-api
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30800