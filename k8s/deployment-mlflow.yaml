apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ember-pipeline
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.12.1
          imagePullPolicy: IfNotPresent
          command: ["mlflow"]
          args:
            - server
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=/mlruns
            - --default-artifact-root=/mlruns/artifacts
            - --serve-artifacts
            - --workers=1 

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu:    "100m"
              memory: "512Mi"
            limits:
              cpu:    "500m"
              memory: "1Gi"
          env:
            - name: GUNICORN_CMD_ARGS
              value: "--workers=1 --timeout=120"

          volumeMounts:
            - name: mlruns
              mountPath: /mlruns

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5

      volumes:
        - name: mlruns
          hostPath:
            path: /run/desktop/mnt/host/c/Users/bcs/Desktop/Energy World Project V2/mlruns
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: ember-pipeline
spec:
  selector:
    app: mlflow
  type: NodePort
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30500
