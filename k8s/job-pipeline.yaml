apiVersion: batch/v1
kind: Job
metadata:
  name: ember-pipeline
  namespace: ember-pipeline
  labels:
    app: ember-pipeline
    version: "1.0.0"

spec:
  ttlSecondsAfterFinished: 3600  # auto-clean job 1h after completion
  backoffLimit: 2                # retry up to 2 times on failure

  template:
    metadata:
      labels:
        app: ember-pipeline

    spec:
      restartPolicy: OnFailure

      # ── Init container: wait for MLflow to be ready ───────────────────────
      initContainers:
        - name: wait-for-mlflow
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -sf http://mlflow-service:5000/health; do
                echo "Waiting for MLflow..."; sleep 5;
              done

      # ── Main container ────────────────────────────────────────────────────
      containers:
        - name: pipeline
          image: ember-energy-pipeline:latest  # ← update with registry/tag
          imagePullPolicy: IfNotPresent

          command:
            - python
            - pipeline.py
            - --csv
            - /app/data/raw/yearly_full_release_long_format.csv
            - --train_until
            - "2016"
            - --forecast_until
            - "2030"
            - "--force"

          envFrom:
            - configMapRef:
                name: ember-config
            - secretRef:
                name: ember-secrets

          resources:
            requests:
              cpu: "500m"   # was "500" — must use millicores suffix
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          volumeMounts:
            - name: data
              mountPath: /app/data
              readOnly: true
            - name: outputs
              mountPath: /app/outputs
            - name: mlruns
              mountPath: /app/mlruns
            - name: cache
              mountPath: /app/.cache

      # ── Volumes ───────────────────────────────────────────────────────────
      volumes:
        - name: data
          hostPath:
            path: /run/desktop/mnt/host/c/Users/bcs/Desktop/Energy World Project V2/data
            type: Directory
        - name: outputs
          hostPath:
            path: /run/desktop/mnt/host/c/Users/bcs/Desktop/Energy World Project V2/outputs
            type: DirectoryOrCreate
        - name: mlruns
          hostPath:
            path: /run/desktop/mnt/host/c/Users/bcs/Desktop/Energy World Project V2/mlruns
            type: DirectoryOrCreate
        - name: cache
          hostPath:
            path: /run/desktop/mnt/host/c/Users/bcs/Desktop/Energy World Project V2/.cache
            type: DirectoryOrCreate