# ruff.toml — Ember Energy Forecasting
# Replaces: flake8 + isort + black
# Docs: https://docs.astral.sh/ruff/

# ── Target ────────────────────────────────────────────────────────────────────
target-version = "py310"
line-length    = 100

# ── Files to check ────────────────────────────────────────────────────────────
include = ["*.py", "*.pyi"]
exclude = [
    ".git", ".venv", "venv", "__pycache__",
    "build", "dist", "outputs", "notebooks",
    ".dvc", "htmlcov",
]

# ── Linting rules ─────────────────────────────────────────────────────────────
[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import sorting)
    "N",    # pep8 naming
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear (common bugs)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in default args (FastAPI uses this)
    "N803",   # argument name should be lowercase (ML conventions use X)
    "N806",   # variable in function should be lowercase (ML conventions use X, y)
    "SIM108", # ternary operator (sometimes less readable)
    "RUF012", # mutable class attributes (dataclasses handle this)
    "RUF001",
    "RUF005",
    "N817",
]

# Allow these in tests only
[lint.per-file-ignores]
"tests/*" = ["N802", "S101", "ARG001"]  # assert ok in tests

# ── Import sorting (replaces isort) ───────────────────────────────────────────
[lint.isort]
known-first-party = ["src", "api", "pipeline_cache"]
force-sort-within-sections = true

# ── Formatter (replaces black) ────────────────────────────────────────────────
[format]
quote-style            = "double"
indent-style           = "space"
skip-magic-trailing-comma = false
line-ending            = "auto"
