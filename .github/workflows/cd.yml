# .github/workflows/cd.yml
# Triggered on merge to main or version tag push
# Builds, tags, and pushes Docker images to ghcr.io
# Optionally deploys to Kubernetes (uncomment when cluster is ready)

name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"           # e.g. v1.2.3

# Prevent concurrent deployments
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY:       ghcr.io
  IMAGE_PIPELINE: ghcr.io/${{ github.repository_owner }}/ember-energy-pipeline
  IMAGE_API:      ghcr.io/${{ github.repository_owner }}/ember-energy-api
  PYTHON_VERSION: "3.10"

jobs:

  # ── 1. Build & push images ────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      pipeline-tag: ${{ steps.meta-pipeline.outputs.version }}
      api-tag:      ${{ steps.meta-api.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry:  ${{ env.REGISTRY }}
          username:  ${{ github.actor }}
          password:  ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pipeline image tags
      - name: Extract metadata (pipeline image)
        id: meta-pipeline
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PIPELINE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      # API image tags
      - name: Extract metadata (API image)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      # Build & push pipeline image
      - name: Build & push pipeline image
        uses: docker/build-push-action@v5
        with:
          context:    .
          file:       Dockerfile
          push:       true
          tags:       ${{ steps.meta-pipeline.outputs.tags }}
          labels:     ${{ steps.meta-pipeline.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # Build & push API image
      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context:    .
          file:       Dockerfile.api
          push:       true
          tags:       ${{ steps.meta-api.outputs.tags }}
          labels:     ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Summary
        run: |
          echo "### Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline | \`${{ steps.meta-pipeline.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| API      | \`${{ steps.meta-api.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY

