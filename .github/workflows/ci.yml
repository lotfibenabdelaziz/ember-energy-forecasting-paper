# .github/workflows/ci.yml
# Runs on every push and PR to main/develop
# Jobs: lint → unit-tests → dl-tests → docker-build

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.10"
  IMAGE_NAME: ember-energy-pipeline

jobs:

  # ── 1. Lint ───────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff only
        run: |
          pip install --upgrade pip --retries 5 --timeout 60
          pip install "ruff==0.6.9" --retries 5 --timeout 60

      - name: ruff lint
        run: |
          ruff check src/ api/ pipeline.py pipeline_cache.py mlflow_config.py

      - name: ruff format check
        run: |
          ruff format --check src/ api/ pipeline.py pipeline_cache.py mlflow_config.py

  # ── 2. Unit tests ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip --retries 5 --timeout 120
          pip install --retries 5 --timeout 120 \
            pandas numpy scipy scikit-learn xgboost statsmodels \
            matplotlib seaborn mlflow fastapi uvicorn \
            pydantic python-jose passlib python-dotenv \
            pyyaml httpx pytest pytest-cov pytest-timeout \
            langchain langchain-openai langchain-community openai

      - name: Create .env
        run: |
          echo "CSV_PATH=data/raw/yearly_full_release_long_format.csv" >> .env
          echo "OUTPUT_ROOT=outputs" >> .env
          echo "TRAIN_END=2016" >> .env
          echo "VAL_END=2020" >> .env
          echo "TEST_END=2024" >> .env
          echo "FORECAST_START=2025" >> .env
          echo "FORECAST_END=2030" >> .env
          echo "ADMIN_USERNAME=admin" >> .env
          echo "ADMIN_PASSWORD=ci-test-password" >> .env
          echo "SECRET_KEY=ci-test-secret-key-32-chars-minimum" >> .env
          echo "MLFLOW_TRACKING_URI=./mlruns" >> .env

      - name: Run unit tests (no DL, no API, no pipeline integration)
        run: |
          pytest tests/test_eda.py \
                 tests/test_preprocessing.py \
                 tests/test_modeling.py \
                 tests/test_forecasting.py \
                 tests/test_mlflow_config.py \
                 tests/test_pipeline.py \
                 tests/test_robustness.py \
                 tests/test_significance.py \
            -v --tb=short \
            -p no:cacheprovider \
            --cov=src --cov=pipeline --cov=pipeline_cache \
            --cov-report=xml:coverage.xml \
            --cov-config=.coveragerc \
            --timeout=120

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── 3. API tests ──────────────────────────────────────────────────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install API dependencies
        run: |
          pip install --upgrade pip --retries 5 --timeout 120
          pip install --retries 5 --timeout 120 \
            fastapi uvicorn pydantic httpx \
            python-jose passlib python-dotenv \
            pandas numpy mlflow pytest pytest-timeout \
            langchain langchain-openai openai

      - name: Create .env
        run: |
          echo "ADMIN_USERNAME=admin" >> .env
          echo "ADMIN_PASSWORD=ci-test-password" >> .env
          echo "SECRET_KEY=ci-test-secret-key-32-chars-minimum" >> .env
          echo "OUTPUT_ROOT=outputs" >> .env
          echo "MLFLOW_TRACKING_URI=./mlruns" >> .env

      - name: Run API tests
        run: |
          pytest tests/test_api.py \
            -v --tb=short \
            -p no:cacheprovider \
            --timeout=60

  # ── 4. Deep learning tests ────────────────────────────────────────────────
  dl-tests:
    name: Deep Learning Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install torch CPU + test deps
        run: |
          pip install --upgrade pip --retries 5 --timeout 120
          pip install --retries 5 --timeout 120 \
            torch --index-url https://download.pytorch.org/whl/cpu
          pip install --retries 5 --timeout 120 \
            scikit-learn numpy pandas mlflow pytest pytest-timeout

      - name: Run DL tests (unit only — no CLI integration)
        run: |
          pytest tests/test_deeplearning.py \
            -v --tb=short \
            -p no:cacheprovider \
            --timeout=180 \
            -k "not TestDeepLearningCLI"

  # ── 5. Docker build ───────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pipeline image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: ember-energy-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
