# .github/workflows/ci.yml
# Runs on every push and PR to main/develop
# Jobs: lint → unit-tests → build-docker

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.10"
  IMAGE_NAME: ember-energy-pipeline

jobs:

  # ── 1. Lint & type-check ───────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 black isort mypy
          pip install -r requirements.txt

      - name: flake8
        run: flake8 src/ api/ pipeline.py pipeline_cache.py --max-line-length=100 --ignore=E501,W503

      - name: black (check only)
        run: black src/ api/ pipeline.py pipeline_cache.py --check --line-length 100

      - name: isort (check only)
        run: isort src/ api/ pipeline.py pipeline_cache.py --check-only --profile black

  # ── 2. Unit tests ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: Create .env
        run: |
          echo "CSV_PATH=data/raw/yearly_full_release_long_format.csv" >> .env
          echo "OUTPUTS_DIR=outputs" >> .env
          echo "TRAIN_UNTIL=2019" >> .env
          echo "FORECAST_UNTIL=2025" >> .env

      - name: Run unit tests
        run: |
          pytest tests/test_eda.py \
                 tests/test_preprocessing.py \
                 tests/test_modeling.py \
                 tests/test_forecasting.py \
                 tests/test_mlflow_config.py \
            -v --tb=short \
            --cov=src --cov=pipeline --cov=pipeline_cache \
            --cov-report=xml:coverage.xml \
            --cov-config=.coveragerc \
            --timeout=120

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── 3. Deep learning unit tests (torch required) ──────────────────────────
  dl-tests:
    name: Deep Learning Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run DL unit tests (no CLI integration)
        run: |
          pytest tests/test_deeplearning.py \
            -v --tb=short \
            --ignore-glob="*TestDLCLI*" \
            --timeout=120 \
            -k "not TestDLCLI"

  # ── 4. Build Docker image ─────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pipeline image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: ember-energy-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
