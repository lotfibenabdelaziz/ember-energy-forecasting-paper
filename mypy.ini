[mypy]
# ── Global settings ───────────────────────────────────────────────────────────
python_version         = 3.10
# strict mode off — enabling selectively below instead of all-at-once
strict                 = False
warn_return_any        = True
warn_unused_configs    = True
warn_unused_ignores    = True
warn_redundant_casts   = True
# all functions in src.*/api.* must have type annotations (see per-module section)
disallow_untyped_defs  = True
# too strict for ML libs (numpy, sklearn) — left off globally
disallow_untyped_calls = False
check_untyped_defs     = True
# explicit per-module overrides below instead of a blanket ignore
ignore_missing_imports = False
no_implicit_optional   = True
show_error_codes       = True
pretty                 = True
color_output           = True

# Output format
error_summary          = True
show_column_numbers    = True
show_error_context     = True

# ── Source modules (type-checked strictly) ────────────────────────────────────
[mypy-src.*]
disallow_untyped_defs  = True
warn_return_any        = True

[mypy-api.*]
disallow_untyped_defs  = True
warn_return_any        = True

# ── Third-party stubs: ignored (no stubs available) ──────────────────────────
[mypy-pandas.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-seaborn.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-xgboost.*]
ignore_missing_imports = True

[mypy-statsmodels.*]
ignore_missing_imports = True

[mypy-tensorflow.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True

[mypy-keras.*]
ignore_missing_imports = True

[mypy-langchain.*]
ignore_missing_imports = True

[mypy-langchain_openai.*]
ignore_missing_imports = True

[mypy-langchain_community.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

[mypy-tests.*]
ignore_errors = True

# ── Notebooks and outputs (excluded from type checking) ───────────────────────
[mypy-notebooks.*]
ignore_errors = True
